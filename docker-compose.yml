services:
  db:
    image: postgres:16
    container_name: vb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: volleyball_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
